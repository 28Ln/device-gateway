# Minimal CI: run the test suite on every push and pull request.
#
# This workflow was authored without network access in the development
# sandbox, so it has NOT been executed here. The steps mirror the locally
# verified command:
#   BTF_DATA_DIR=./ci-data python -m pip install -r requirements-dev.txt
#   BTF_DATA_DIR=./ci-data python -m pytest -q
# requirements-dev.txt pulls in requirements.txt plus pytest.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Keep runtime state out of the source tree; the test suite only needs a
      # writable temp data dir.
      BTF_DATA_DIR: ${{ github.workspace }}/ci-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          mkdir -p "$BTF_DATA_DIR"
          python -m pytest -q
