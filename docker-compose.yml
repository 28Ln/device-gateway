services:
  btf-device-gateway:
    build: .
    container_name: btf-device-gateway
    restart: unless-stopped
    environment:
      BTF_DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://115.191.10.45}
      NEW_API_BASE_URL: ${NEW_API_BASE_URL:-http://new-api:3000}
      NEW_API_TOKEN: ${NEW_API_TOKEN}
      INTERNAL_ADMIN_TOKEN: ${INTERNAL_ADMIN_TOKEN}
      BTF_ADMIN_USERNAME: ${BTF_ADMIN_USERNAME:-admin}
      BTF_ADMIN_PASSWORD: ${BTF_ADMIN_PASSWORD}
      PAYMENT_INSTRUCTIONS: ${PAYMENT_INSTRUCTIONS:-请联系销售确认付款，订单确认后设备授权会自动延期。}
      DEMO_PAYMENT_ENABLED: ${DEMO_PAYMENT_ENABLED:-false}
      MOCK_PAYMENT_SECRET: ${MOCK_PAYMENT_SECRET:-}
      PAYMENT_NOTIFY_URL: ${PAYMENT_NOTIFY_URL:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_SERIAL_NO: ${WECHAT_SERIAL_NO:-}
      WECHAT_PLATFORM_SERIAL_NO: ${WECHAT_PLATFORM_SERIAL_NO:-}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_PLATFORM_PUBLIC_KEY: ${WECHAT_PLATFORM_PUBLIC_KEY:-}
      WECHAT_API_BASE_URL: ${WECHAT_API_BASE_URL:-https://api.mch.weixin.qq.com}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
    ports:
      - "80:8080"
    volumes:
      - ./data:/data
      - ./new-api-dist:/app/new-api-dist:ro
    networks:
      - new-api-network

networks:
  new-api-network:
    external: true
