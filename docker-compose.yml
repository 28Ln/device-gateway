services:
  btf-device-gateway:
    build: .
    container_name: btf-device-gateway
    restart: unless-stopped
    # Secrets such as NEW_API_TOKEN, MOCK_PAYMENT_SECRET and provider keys are
    # read from .env when present. Variables absent from .env are NOT injected,
    # so application defaults remain in effect. `environment` below overrides
    # env_file entries when both define the same key.
    env_file:
      - path: .env
        required: false
    environment:
      BTF_DATA_DIR: /data
      # Production MUST set this to the public HTTPS domain.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      # Trusted browser origins for CSRF checks. Defaults to the PUBLIC_BASE_URL
      # origin; set to a comma-separated list to allow extra dashboard hosts.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      NEW_API_BASE_URL: ${NEW_API_BASE_URL:-http://new-api:3000}
      # NEW_API_TOKEN is intentionally not listed here. Docker Compose injects an
      # empty string for an unset substitution without a default value, which
      # would override any application-level fallback. It is passed via env_file
      # so an unset value stays truly unset.
      DEMO_PAYMENT_ENABLED: ${DEMO_PAYMENT_ENABLED:-false}
      MOCK_PAYMENT_SECRET: ${MOCK_PAYMENT_SECRET:-}
      PAYMENT_NOTIFY_URL: ${PAYMENT_NOTIFY_URL:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_SERIAL_NO: ${WECHAT_SERIAL_NO:-}
      WECHAT_PLATFORM_SERIAL_NO: ${WECHAT_PLATFORM_SERIAL_NO:-}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_PLATFORM_PUBLIC_KEY: ${WECHAT_PLATFORM_PUBLIC_KEY:-}
      WECHAT_API_BASE_URL: ${WECHAT_API_BASE_URL:-https://api.mch.weixin.qq.com}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
    ports:
      - "80:8080"
    volumes:
      # The container runs as uid 10001 (see Dockerfile). The host bind-mount
      # must be writable by that uid or startup fails when the SQLite database
      # and generated-images directory are created:
      #   sudo mkdir -p ./data && sudo chown -R 10001:10001 ./data
      - ./data:/data
      - ./new-api-dist:/app/new-api-dist:ro
    # The root filesystem is read-only; only the /data volume and an in-memory
    # /tmp remain writable. Python bytecode writing is disabled in the image.
    read_only: true
    tmpfs:
      - /tmp
    # no-new-privileges blocks setuid/setgid privilege escalation even inside
    # the container, complementing the non-root USER in the Dockerfile.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - new-api-network

networks:
  new-api-network:
    external: true
