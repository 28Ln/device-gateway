[project]
name = "btf-device-gateway"
version = "0.1.0"
description = "Device-first authorization gateway for BTF API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

