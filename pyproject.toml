# NOTE: runtime dependencies intentionally live in ``requirements.txt`` as the
# single source of truth (Docker builds install that file directly). The list
# used to be duplicated here, which drifted easily; do not re-add it — update
# requirements.txt instead.
[project]
name = "btf-device-gateway"
version = "0.1.0"
description = "Device-first authorization gateway for BTF API"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Test-only dependencies; see requirements-dev.txt for the CLI-installable view.
test = [
  "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
